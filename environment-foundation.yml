name: chapter1-foundation
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - geopandas
  - pandas
  - pyarrow
  - xarray
  - netcdf4
  - pyproj
  - rasterio
  - matplotlib
  - scipy
  - cdsapi>=0.7.7
  - ruff
  - pytest
  - pip
  - pip:
      - earthengine-api
      # Includes hf_xet, the official client for Hugging Face's weight storage.
      - "torch==2.10.0"
      - "transformers==4.57.6"
      - "huggingface-hub==0.36.2"
      - "datasets==4.5.0"
      - "scikit-learn==1.7.2"
      - "einops==0.8.2"
      - "safetensors==0.8.0"
      - "accelerate==1.15.0"
      - "deprecated==1.3.1"
      - "setuptools-scm==10.3.4"
      - "Cython==3.3.0"
      # Install the held pinned source in editable mode after unpacking it;
      # the upstream wheel omits model subpackages. See the execution note.
