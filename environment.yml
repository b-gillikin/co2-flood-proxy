  - numpy
  - pandas
  - xarray
  - netcdf4
  - geopandas
  - pyproj
  - rasterio
  - matplotlib
  - scikit-learn
  - cdsapi>=0.7.7
  - ruff
  - pytest
  - scipy
  - statsmodels
  - pyarrow
  - pip
